<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Document</title>
    <style>
        .canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        canvas {
            position: relative;
            z-index: 1;
            display: block;
            border: 2px solid black;
        }

        .background-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            z-index: 0;
        }

        #pesan-game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 24px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: black;
            font: bold 28px Arial, sans-serif;
            white-space: nowrap;
            pointer-events: none;
        }

        #pesan-game-over[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="canvas-wrapper">
        <img class="background-image" src="bg grafkom.jpeg" alt="">
        <canvas width="1850" height="1000" id="mycanvas"></canvas>
        <div id="pesan-game-over" role="status" aria-live="polite" hidden>
            GAME OVER<br>Klik untuk restart
        </div>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
